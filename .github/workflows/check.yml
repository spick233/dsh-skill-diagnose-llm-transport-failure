name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check scripts/tls-probe.mjs
          node --check scripts/find-transport-failures.mjs
      - name: Usage contract
        # A non-zero exit is the assertion here, so capture it instead of letting
        # the runner's `bash -e` abort before the comparison runs.
        run: |
          expect_exit() {
            want=$1
            shift
            got=0
            "$@" || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "FAIL: expected exit $want, got $got for: $*"
              exit 1
            fi
          }
          expect_exit 2 node scripts/tls-probe.mjs
          expect_exit 2 node scripts/find-transport-failures.mjs --dir /nonexistent
      - name: Log summarizer on an empty tree
        run: |
          mkdir -p /tmp/logs
          node scripts/find-transport-failures.mjs --dir /tmp/logs
